authorization:
  port: 9090
  host: localhost
rest:
  clients:
    bazar-persona-url: http://localhost:8081/api
    bazar-authz-url: http://localhost:8082/api
    bazar-files-url: http://localhost:8083/api


app:
  join-space:
    base-join-url: https://bazar-space.ru/join
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: localhost:8090
  kafka:
    properties:
      sasl.mechanism: PLAIN
      sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="test" password="test";
    security:
      protocol: PLAINTEXT
      consumers:
        file-events:
          name: bazar.files.events