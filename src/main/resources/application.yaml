app:
  database:
    batchSize: 200
  jobs:
    reset-outbox-locks:
      enabled: true
      threshold: 60000
      max-per-run: 5000
    space-outbox:
      enabled: true
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bzrspace}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
  liquibase:
    change-log: db/changelog/changelog-master.yaml
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KC_URL:http://localhost:9999/realms/bazar-realm}
  threads:
    virtual:
      enabled: true
  cache:
    type: caffeine
  kafka:
    enabled: true
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: bazar-space
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.value.default.type: org.bazar.space.adapter.inbound.kafka.BazarFilesEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    security:
      protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_PLAINTEXT}
    topics:
      producers:
        space-events:
          name: space.events
          enabled: true
      consumers:
        file-events:
          name: ${FILE_EVENTS_TOPIC:bazar.files.events}
          enabled: true
    properties:
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-512}
      sasl.jaas.config: >
        org.apache.kafka.common.security.scram.ScramLoginModule required
        username="${KAFKA_USERNAME}"
        password="${KAFKA_PASSWORD}";
server:
  servlet:
    context-path: /api
  port: 8080
management:
  server:
    port: 8090
logging:
  level:
    org:
      bazar: ${LOGGING_LEVEL:DEBUG}
authorization:
  port: ${BAZAR_AUTHORIZATION_PORT:9090}
  host: ${BAZAR_AUTHORIZATION_HOST:localhost}
rest:
  clients:
    bazar-persona-url: ${BAZAR_PERSONA_API_URL:http://localhost:8081/api}
    bazar-authz-url: ${BAZAR_AUTHORIZATION_API_URL:http://localhost:8082/api}
    bazar-files-url: ${BAZAR_FILES_API_URL:http://localhost:8083/api}

file-domain: bazar-space