app:
  database:
    batchSize: 200
  join-link:
    base-join-url: ${JOIN_LINK_BASE_URL}
  jobs:
    reset-outbox-locks:
      enabled: true
      threshold: 60000
      max-per-run: 5000
    space-outbox:
      enabled: true
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
  liquibase:
    change-log: db/changelog/changelog-master.yaml
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KC_URL}
  threads:
    virtual:
      enabled: true
  cache:
    type: caffeine
  kafka:
    enabled: true
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: bazar-space
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.value.default.type: org.bazar.space.adapter.inbound.kafka.BazarFilesEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    security:
      protocol: ${KAFKA_SECURITY_PROTOCOL}
    topics:
      producers:
        space-events:
          name: space.events
          enabled: true
      consumers:
        file-events:
          name: ${FILE_EVENTS_TOPIC:bazar.files.events}
          enabled: true
    properties:
      sasl.mechanism: ${KAFKA_SASL_MECHANISM}
      sasl.jaas.config: >
        org.apache.kafka.common.security.scram.ScramLoginModule required
        username="${KAFKA_USERNAME}"
        password="${KAFKA_PASSWORD}";
server:
  servlet:
    context-path: /api
  port: 8080
management:
  server:
    port: 8090
logging:
  level:
    org:
      bazar: ${LOGGING_LEVEL:DEBUG}
authorization:
  port: ${BAZAR_AUTHORIZATION_PORT}
  host: ${BAZAR_AUTHORIZATION_HOST}
rest:
  clients:
    bazar-persona-url: ${BAZAR_PERSONA_API_URL}
    bazar-authz-url: ${BAZAR_AUTHORIZATION_API_URL}
    bazar-files-url: ${BAZAR_FILES_API_URL}

file-domain: bazar-space
validation:
  avatar:
    allowed_formats:
      - svg
      - png
      - jpg
      - jpeg
      - webp
    max_size_bytes: 5242880
    allowed_mime_types:
      - image/svg+xml
      - image/png
      - image/jpeg
      - image/webp