openapi: 3.1.0
info:
  title: Bazar space openapi
  version: v1
paths:
  /space:
    get:
      tags:
        - space-controller
      operationId: getAllSpaces
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/GetSpacesResponse"
    post:
      tags:
        - space-controller
      operationId: createSpace
      parameters:
        - in: query
          name: name
          description: space name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                $ref: '#/components/schemas/GetSpaceDto'
  /space/user:
    post:
      tags:
        - space-member-controller
      operationId: addUserToSpace
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddUserToSpaceDtoRequest"
        required: true
      responses:
        "200":
          description: OK
  /spaces/{spaceId}/users:
    get:
      tags:
        - space-member-controller
      operationId: getAllUsersInSpaceEnriched
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/GetUsersInSpaceResponse"
  /v1/spaces/{spaceId}/users/{userId}/raw:
    get:
      tags:
        - space-member-controller
      operationId: getUserInSpace
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/UserInSpaceRawDto"
  /v1/spaces/{spaceId}/join-link:
    get:
      tags:
        - space-controller
      operationId: getSpaceJoinLink
      description: Returns the permanent invite link of the space. Requires space_users:ADD permission in the space.
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/SpaceJoinLinkResponse"
        "401":
          description: Not authenticated
        "403":
          description: FORBIDDEN - no space_users:ADD permission in the space
        "404":
          description: SPACE_NOT_FOUND
  /v1/spaces/by-code/{code}:
    get:
      tags:
        - space-controller
      operationId: getSpacePreviewByJoinCode
      description: Public endpoint, no authentication. Returns only name and avatar of the space the invite code belongs to.
      security: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            maxLength: 32
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/SpacePreviewResponse"
        "404":
          description: SPACE_NOT_FOUND - no space with such join code
  /space/{spaceId}:
    delete:
      tags:
        - space-controller
      operationId: deleteSpace
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
    patch:
      tags:
        - space-controller
      operationId: patchSpace
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: name
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/GetSpaceDto"
  /space/{spaceId}/user/{userId}:
    delete:
      tags:
        - space-member-controller
      operationId: deleteUserFromSpace
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
  /space/{spaceId}/avatar:
    post:
      tags:
        - space-controller
      operationId: initiateAvatarUpload
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvatarUploadRequestDto'
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                $ref: '#/components/schemas/AvatarUploadTicketDtoResponse'
    get:
      tags:
        - space-controller
      operationId: getSpaceAvatar
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                $ref: '#/components/schemas/GetSpaceAvatarsResponse'
components:
  schemas:
    AvatarUploadRequestDto:
      description: file info to initiate avatar upload
      type: object
      required:
        - fileName
        - contentType
        - sizeBytes
      properties:
        fileName:
          type: string
          description: Name of the file to be uploaded
        contentType:
          type: string
          description: MIME type of the file
        sizeBytes:
          type: integer
          format: int64
          description: Size of the file in bytes

    AvatarUploadTicketDtoResponse:
      type: object
      required:
        - avatarId
        - uploadUrl
      properties:
        avatarId:
          type: integer
          format: int64
          description: ID of the created space avatar
        uploadUrl:
          type: string
          description: Pre-signed URL to which the binary file must be PUT

    SpaceAvatarDto:
      description: space avatar state used for polling while the image is loading
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: integer
          format: int64
          description: Avatar ID
        status:
          type: string
          description: Avatar upload status (PENDING, SUCCESS, ERROR)
        url:
          type: string
          description: Public download URL, present once upload succeeded
        createdAt:
          type: string
          format: date-time
          description: Avatar creation time

    GetSpaceAvatarsResponse:
      type: object
      properties:
        avatars:
          type: array
          items:
            $ref: '#/components/schemas/SpaceAvatarDto'

    AddUserToSpaceDtoRequest:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        spaceId:
          type: integer
          format: int64
      required:
        - userId
        - spaceId
    GetSpaceDto:
      description: space info for get requests
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        avatarUrl:
          type: string
          description: URL of the currently active space avatar

    SpaceJoinLinkResponse:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          description: Permanent invite link of the space
          example: https://bazar-space.ru/join/3q2-7wEjRZqF1bXo9sYk4A

    SpacePreviewResponse:
      description: Public space info available by invite link
      type: object
      required:
        - name
      properties:
        name:
          type: string
        avatarUrl:
          type: string
          description: URL of the currently active space avatar

    GetSpacesResponse:
      type: object
      properties:
        spaces:
          type: array
          items:
            $ref: '#/components/schemas/GetSpaceDto'

    GetUsersInSpaceResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserInSpaceDto'
    UserInSpaceRawDto:
      type: object
      required:
        - userId
        - spaceId
        - creator
      properties:
        userId:
          type: string
          format: uuid
          description: User ID
        spaceId:
          type: integer
          format: int64
          description: Space ID
        creator:
          type: boolean
          description: Is user creator of the space
    UserInSpaceDto:
      type: object
      required:
        - userId
        - spaceId
        - username
        - displayName
        - creator
      properties:
        userId:
          type: string
          format: uuid
          description: User ID
        spaceId:
          type: integer
          format: int64
          description: Space ID
        username:
          type: string
          description: userName from bazar-persona/users
        displayName:
          type: string
          description: firstName from bazar-persona/users
        avatarUrl:
          type: string
          format: uri
          description: avatarUrl from bazar-persona/users
        creator:
          type: boolean
          description: Is user creator of the space
        role:
          type: object
          $ref: '#/components/schemas/SimpleRoleDto'
    SimpleRoleDto:
      type: object
      required:
        - id
        - name
        - isVisible
      properties:
        id:
          type: integer
          format: int64
          description: Role ID
        name:
          type: string
          description: Role name
        isVisible:
          type: boolean
          description: Is role visible on UI
